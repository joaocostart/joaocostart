name = "site-api"
main = "src/index.js"
compatibility_date = "2026-11-01"

# api.joaocostart.com -> este Worker (a Cloudflare cria o registo DNS sozinha)
routes = [{ pattern = "api.joaocostart.com", custom_domain = true }]

[vars]
SITE = "https://joaocostart.com"
SITE_ORIGINS = "https://joaocostart.com,https://www.joaocostart.com"

[[d1_databases]]
binding = "DB"
database_name = "site"
database_id = "PREENCHER_DEPOIS_DO_D1_CREATE"

# Segredo (não fica aqui): ADMIN_PASSWORD  ->  npx wrangler secret put ADMIN_PASSWORD
