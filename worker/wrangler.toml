name = "site-api"
main = "src/index.js"
compatibility_date = "2026-11-01"

# api.joaocostart.com -> este Worker (a Cloudflare cria o registo DNS sozinha)
routes = [{ pattern = "api.joaocostart.com", custom_domain = true }]

[vars]
SITE = "https://joaocostart.com"
SITE_ORIGINS = "https://joaocostart.com,https://www.joaocostart.com"
REPO = "joaocostart/joaocostart"

[[d1_databases]]
binding = "DB"
database_name = "site"
database_id = "eac1ca34-8dc0-4e40-ab65-9908294b858d"

# Segredos (não ficam aqui):
#   ADMIN_PASSWORD  ->  npx wrangler secret put ADMIN_PASSWORD
#   GITHUB_TOKEN    ->  npx wrangler secret put GITHUB_TOKEN  (token só deste repositório, Contents: Read and write)
